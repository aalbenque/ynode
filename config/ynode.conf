#########################################################
# YNode - Configuration file
#
# This file setup the configuration variables for server.sh
# launch `server.sh --conf /path/to/ynode.conf`
# Most of these options can also be set through the command line
# Refer to server.sh or launch `server.sh --help` for the options
#
#########################################################

#########################################################
# Binaries
#########################################################

# Path to the `socat` binary 
# Used to listen, manage the SSL stack and dispatch to http1.sh
# Used for the proxy module
export YN_SOCAT_BINARY=$(which socat)

# Path to the `nc` or `ncat` binary
# Used to communicate with the FastCGI socket when the helper is not in use
export YN_NC_BINARY=$(which ncat)

# Path to the `brotli` binary
# Used for br compression (optional)
export YN_BROTLI_BIN="$(which brotli)"

# Path to the `gzip` binary
# Used for gzip compression (optional)
export YN_GZIP_BIN="$(which gzip)"

# Path to the `zstd` binary
# Used for zstd compression (optional)
export YN_ZSTD_BIN="$(which zstd)"

#########################################################
# Network/HTTP options
#########################################################

# TCP port on which socat should listen
# Used when calling `socat`
export YN_HTTP_SERVER_PORT=6680

# Maximum concurrent connections
# Not used for now
export YN_MAXCONN=20

# Set the backlog value socat passes to the listen() system call
export YN_SOCAT_BACKLOG=128

# Value sent in the "Server: " HTTP header
# Gets sent to FastCGI as SERVER_SOFTWARE
export YN_HTTP_SERVER="YNode/0.1"

# Value passed to FastCGI as DEFAULT_NAME and also the hostname
export YN_HTTP_SERVER_NAME="127.0.0.1"

# Max timeout in seconds for keepalive 
# The connection is closed after that amount of time if it doesn't receive data
export YN_MAX_TIMEOUT=5

# Maximum body size in bytes
export YN_MAX_BODY_SIZE=52428800 # 50 MiB

# Maximum amount of chunks read in chunked upload
export YN_MAX_CHUNKS=8192

# Maximum size of a chunk for streaming responses
export YN_CHUNK_SIZE=8192

#########################################################
# Compression
#########################################################

# Compression levels for static assets, respectively for br, gzip and zstd
# Since we cache these assets we can afford higher compression
export YN_BROTLI_LEVEL=9
export YN_GZIP_LEVEL=9
export YN_ZSTD_LEVEL=15

# Compression levels for dynamic content (FastCGI/CGI), respectively for br, gzip and zstd
# On-the-fly compression on a buffered body which already adds overhead, as such it's better to keep it fast
export YN_BROTLI_LEVEL_OTF=1
export YN_GZIP_LEVEL_OTF=3
export YN_ZSTD_LEVEL_OTF=1

#########################################################
# Caching
#########################################################

# Path to the static cache directory generated by file_watch.sh
# Contains metadata auto-generated when a file is requested or the daemon detect a change
# The directory is cleaned up at launch
# Should be on a temporary filesystem
export YN_STATIC_DATA_DIR=/tmp/yn-static-data-dir

#########################################################
# SSL Support
#########################################################

# Enable SSL with YN_SSL=1, the equivalent is ./server.sh --ssl
export YN_SSL=

# Path to the public and private SSL certificates passed to socat
export YN_SSL_CERT="./self-cert.pem"
export YN_SSL_PRIVKEY="./self-cert.key"

#########################################################
# Verbosity
#########################################################

# Enable debug mode , the equivalent is `./server.sh -d`
export YN_DEBUG=

# Enable verbosity, the equivalent is `./server.sh -d`
export YN_VERBOSE=


#########################################################
# FastCGI Support
#########################################################

# Default socket for the FastCGI server, accept Unix socket and TCP addresses, eg:
#   unix:/run/php-fpm/php-fpm.sock
#   tcp:localhost:9000
#   tcp:127.0.0.1:9000
# In the future, can be overriden when loading `module fastcgi` in .ynaccess
export YN_FCGI_URI="unix:/run/php-fpm/php-fpm.sock"

# Path to the FastCGI helper binary. 
# Needs to be compiled with `make` in the root directory
# Use `make clean` beforehand
# If the helper is not present, the application will use the bash which is roughly 10x slower
export YN_HELPER="helper/helper"

#########################################################
# Experimental options
#########################################################

# Enable the HTTP/2 stack. Non-functional for now
export YN_HTTP2=

# Path to the HPACK helper if using the HTTP/2 stack. 
# Does nothing for now
export YN_HPACK_HELPER="helper/hpack_helper.py"


